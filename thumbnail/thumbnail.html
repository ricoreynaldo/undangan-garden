<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<!-- Sumber thumbnail katalog (1200×1500, 4:5). Bunga digambar flora.js milik undangan.
     Render ulang: buka di Chrome 1200×1500 lalu screenshot. -->
<title>Thumbnail — Undangan Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Pinyon+Script&family=Mulish:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 1500px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Mulish', sans-serif;
    color: #2d3e31;
    background:
      radial-gradient(55% 38% at 50% 40%, #ffffff 0%, rgba(255, 255, 255, 0) 70%),
      radial-gradient(80% 50% at 100% 100%, #f7e2dc 0%, rgba(247, 226, 220, 0) 60%),
      radial-gradient(80% 50% at 0% 0%, #e7efdf 0%, rgba(231, 239, 223, 0) 60%),
      #fbf7f0;
  }
  .flora { display: block; width: 100%; height: 100%; overflow: visible; }
  .frame { position: absolute; inset: 34px; border: 1.5px solid rgba(74, 120, 75, .28); border-radius: 26px; }
  .frame::after { content: ''; position: absolute; inset: 10px; border: 1px solid rgba(74, 120, 75, .16); border-radius: 18px; }

  .corner { position: absolute; width: 470px; height: 470px; }
  .corner.tl { top: -30px; left: -38px; }
  .corner.tr { top: -30px; right: -38px; transform: scaleX(-1); }
  .corner.bl { bottom: 150px; left: -60px; width: 360px; height: 360px; transform: scaleY(-1); }
  .corner.br { bottom: 150px; right: -60px; width: 360px; height: 360px; transform: scale(-1, -1); }

  .meadow { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; }
  .meadow .flora { position: absolute; inset: 0; }

  .center { position: absolute; left: 0; right: 0; top: 168px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .label { font: 700 20px/1.4 'Mulish'; letter-spacing: 8px; text-transform: uppercase; color: #4a784b; }
  .ring { position: relative; width: 480px; height: 480px; margin: 22px 0 6px; }
  .ring-img { position: absolute; inset: 15.3%; border-radius: 50%; overflow: hidden; border: 9px solid #fff; box-shadow: 0 30px 60px -30px rgba(52, 78, 54, .6); }
  .ring-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ring .wreath-box { position: absolute; inset: 0; }
  .names { font: 400 168px/1 'Pinyon Script', cursive; white-space: nowrap; margin-top: 4px; }
  .names em { font-style: normal; color: #d4677a; font-size: .74em; margin: 0 .12em 0 .06em; }
  .date { font: italic 400 36px/1.4 'Fraunces', serif; letter-spacing: 6px; color: #56665a; margin-top: 6px; }
  .place { margin-top: 18px; }
  .chip {
    display: inline-flex; align-items: center; gap: 14px; margin-top: 30px;
    padding: 14px 30px 14px 16px; border-radius: 999px; background: #4a784b; color: #fff;
    font: 700 19px 'Mulish'; letter-spacing: 4px; text-transform: uppercase;
    box-shadow: 0 18px 34px -16px rgba(58, 98, 59, .9);
  }
  .chip span { width: 40px; height: 40px; }
  .bf { position: absolute; width: 64px; height: 64px; }
  .bf svg { width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner tl"><div data-flora="corner"></div></div>
  <div class="corner tr"><div data-flora="corner" data-alt="1"></div></div>
  <div class="corner bl"><div data-flora="corner" data-alt="1"></div></div>
  <div class="corner br"><div data-flora="corner"></div></div>
  <div class="meadow" data-flora="meadow" data-seed="3" data-layers="3"></div>

  <div class="center">
    <p class="label">The wedding of</p>
    <div class="ring">
      <div class="ring-img"><img src="../public/img-undangan/d0defbbc7f6b72c5f8f8f7620ad5691a.jpg" alt="" /></div>
      <div class="wreath-box" data-flora="wreath"></div>
    </div>
    <h1 class="names">Arga<em>&amp;</em>Sekar</h1>
    <p class="date">18 · 04 · 2027</p>
    <p class="label place">Kebun Raya Bogor</p>
    <div class="chip"><span data-flora="glyph" data-t="blossom" data-pal="blush"></span>Garden Theme</div>
  </div>

  <div class="bf" style="left:880px;top:560px;transform:rotate(28deg)" data-bf="#f3a35c,#f9d59a"></div>
  <div class="bf" style="left:250px;top:930px;width:50px;height:50px;transform:rotate(-34deg)" data-bf="#8fb1e8,#d9e5fb"></div>

  <script src="../public/js/flora.js"></script>
  <script>
    const wing = (a, b) => `<path d="M0-1C-6-17-26-23-27-10C-28-1-14 3 0 1Z" fill="${a}"/><path d="M0-1C-8-11-20-14-21-8C-21-3-12 0 0 0Z" fill="${b}" opacity=".85"/><path d="M0 1C-7 4-19 9-16 18C-13 24-4 14 0 3Z" fill="${a}"/><circle cx="-18" cy="-11" r="2.2" fill="#fff" opacity=".7"/>`;
    document.querySelectorAll('[data-bf]').forEach((el) => {
      const [a, b] = el.dataset.bf.split(',');
      el.innerHTML = `<svg viewBox="-30 -30 60 60"><g transform="scale(.8 1)">${wing(a, b)}</g><g transform="scale(-.8 1)">${wing(a, b)}</g><ellipse rx="1.8" ry="10" cy="2" fill="#4a3a34"/><path d="M0-8Q-3-15-6-18M0-8Q3-15 6-18" stroke="#4a3a34" stroke-width="1" fill="none"/></svg>`;
    });
  </script>
</body>
</html>
